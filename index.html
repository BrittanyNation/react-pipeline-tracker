<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline — React Job Application Tracker</title>
<style>
  :root{
    --ink:#2b2440; --paper:#faf7ff; --card:#ffffff;
    --plum:#6d4fc2; --plum-dark:#54399e; --gold:#f2b33d; --rose:#ef6a8a;
    --teal:#2ea89a; --sky:#4f8fd0; --grey:#8a84a0; --line:#e6ddf5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:linear-gradient(120deg,var(--plum) 0%,#8a5fc0 55%,var(--rose) 130%);color:#fff;padding:28px 20px 22px}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px}
  header h1{margin:0;font-size:30px;letter-spacing:.3px}
  header p{margin:6px 0 0;opacity:.92;font-size:15px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:10px 16px;min-width:104px}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
  main{padding:22px 0 48px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(84,57,158,.06)}
  .panel h2{margin:0 0 12px;font-size:17px}
  form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  form.add .full{grid-column:1/-1}
  label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);display:block;margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--plum);outline-offset:0;border-color:transparent}
  button{cursor:pointer;border:none;border-radius:9px;font-size:15px;font-weight:600}
  .btn-add{background:var(--plum);color:#fff;padding:11px 18px}
  .btn-add:hover{background:var(--plum-dark)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input{flex:1;min-width:180px}
  .toolbar select{width:auto;min-width:170px}
  .card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--plum);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .card .grow{flex:1;min-width:0}
  .card h3{margin:0;font-size:16px}
  .card .meta{font-size:13px;color:var(--grey);margin-top:3px}
  .pill{border-radius:999px;padding:6px 12px;font-size:13px;color:#fff;white-space:nowrap}
  .pill:hover{filter:brightness(1.1)}
  .st-Applied{background:var(--sky)} .st-Screening{background:var(--teal)}
  .st-Interview{background:var(--gold);color:#4a3200} .st-Offer{background:#3f9e4d}
  .st-Rejected{background:var(--grey)}
  .mini{background:none;color:var(--grey);font-size:13px;padding:6px 4px}
  .mini:hover{color:var(--rose)}
  .empty{text-align:center;color:var(--grey);padding:30px 10px;font-size:15px}
  footer{color:var(--grey);font-size:13px;text-align:center;padding:0 16px 34px}
  @media (max-width:560px){ form.add{grid-template-columns:1fr} .card{flex-wrap:wrap} }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const LANES = [
  "Email / Front-End / Web Dev",
  "Design (UI/UX, Web)",
  "Tech Writing / Copy / Content",
  "Claims / Prior Auth",
  "Billing / Revenue Cycle",
  "Insurance Operations",
  "Bookkeeping",
  "Customer Service (written)",
  "HR Coordination",
];
const STATUSES = ["Applied", "Screening", "Interview", "Offer", "Rejected"];
const KEY = "pipeline-apps-v1";

const SEED = [
  { id: 1, company: "Canvas Medical", title: "Customer Operations Coordinator", lane: "Customer Service (written)", pay: "$65,000-$80,000", status: "Applied" },
  { id: 2, company: "Clarity RCM", title: "Dermatology Revenue Cycle Specialist", lane: "Billing / Revenue Cycle", pay: "$55,000-$60,000", status: "Applied" },
];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SEED;
}

function Stat({ value, label }) {
  return (
    <div className="stat"><b>{value}</b><span>{label}</span></div>
  );
}

function AppCard({ app, onAdvance, onReject, onDelete }) {
  return (
    <div className="card">
      <div className="grow">
        <h3>{app.company}</h3>
        <div className="meta">{app.title} · {app.lane}{app.pay ? " · " + app.pay : ""}</div>
      </div>
      <button className={"pill st-" + app.status} title="Tap to move to the next stage"
        onClick={() => onAdvance(app.id)}>{app.status}</button>
      {app.status !== "Rejected" &&
        <button className="mini" title="Mark rejected" onClick={() => onReject(app.id)}>✕ reject</button>}
      <button className="mini" title="Remove" onClick={() => onDelete(app.id)}>🗑</button>
    </div>
  );
}

function App() {
  const [apps, setApps] = useState(load);
  const [company, setCompany] = useState("");
  const [title, setTitle] = useState("");
  const [lane, setLane] = useState(LANES[0]);
  const [pay, setPay] = useState("");
  const [query, setQuery] = useState("");
  const [laneFilter, setLaneFilter] = useState("All lanes");

  useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify(apps)); } catch (e) {}
  }, [apps]);

  function addApp(e) {
    e.preventDefault();
    if (!company.trim() || !title.trim()) return;
    const next = {
      id: Date.now(),
      company: company.trim(),
      title: title.trim(),
      lane,
      pay: pay.trim(),
      status: "Applied",
    };
    setApps([next, ...apps]);
    setCompany(""); setTitle(""); setPay("");
  }

  function advance(id) {
    setApps(apps.map(a => {
      if (a.id !== id) return a;
      const i = STATUSES.indexOf(a.status);
      const nextStatus = i >= 3 ? "Applied" : STATUSES[i + 1]; // Offer wraps back to Applied; Rejected handled separately
      return { ...a, status: a.status === "Rejected" ? "Applied" : nextStatus };
    }));
  }
  function reject(id) { setApps(apps.map(a => a.id === id ? { ...a, status: "Rejected" } : a)); }
  function remove(id) { setApps(apps.filter(a => a.id !== id)); }

  const visible = apps.filter(a => {
    const matchesLane = laneFilter === "All lanes" || a.lane === laneFilter;
    const q = query.trim().toLowerCase();
    const matchesQuery = !q || a.company.toLowerCase().includes(q) || a.title.toLowerCase().includes(q);
    return matchesLane && matchesQuery;
  });

  const count = s => apps.filter(a => a.status === s).length;

  return (
    <div>
      <header>
        <div className="wrap">
          <h1>🌼 Pipeline</h1>
          <p>Your job hunt, in one place. Add an application, tap its badge to move it along, and watch the interviews stack up.</p>
          <div className="stats">
            <Stat value={apps.length} label="Applications" />
            <Stat value={count("Screening")} label="Screening" />
            <Stat value={count("Interview")} label="Interviews" />
            <Stat value={count("Offer")} label="Offers" />
          </div>
        </div>
      </header>
      <main className="wrap">
        <div className="panel">
          <h2>Add an application</h2>
          <form className="add" onSubmit={addApp}>
            <div><label>Company</label>
              <input value={company} onChange={e => setCompany(e.target.value)} placeholder="e.g. Canvas Medical" /></div>
            <div><label>Role title</label>
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Email Developer" /></div>
            <div><label>Lane</label>
              <select value={lane} onChange={e => setLane(e.target.value)}>
                {LANES.map(l => <option key={l} value={l}>{l}</option>)}
              </select></div>
            <div><label>Pay (as listed)</label>
              <input value={pay} onChange={e => setPay(e.target.value)} placeholder="e.g. $55,000-$60,000" /></div>
            <div className="full"><button className="btn-add" type="submit">Add to pipeline</button></div>
          </form>
        </div>

        <div className="toolbar">
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search company or title…" />
          <select value={laneFilter} onChange={e => setLaneFilter(e.target.value)}>
            <option>All lanes</option>
            {LANES.map(l => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>

        {visible.length === 0
          ? <div className="empty">Nothing here yet — add your first application above.</div>
          : visible.map(a => (
              <AppCard key={a.id} app={a} onAdvance={advance} onReject={reject} onDelete={remove} />
            ))}
      </main>
      <footer>Built with React — components, hooks (useState + useEffect), and localStorage persistence. Your entries save in this browser automatically.</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
