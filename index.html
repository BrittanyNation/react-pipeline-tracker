<style>
  :root{
    --ink:#2b2440; --paper:#faf7ff; --card:#ffffff;
    --plum:#6d4fc2; --plum-dark:#54399e; --gold:#f2b33d; --rose:#ef6a8a;
    --teal:#2ea89a; --sky:#4f8fd0; --grey:#8a84a0; --line:#e6ddf5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:linear-gradient(120deg,var(--plum) 0%,#8a5fc0 55%,var(--rose) 130%);color:#fff;padding:28px 20px 22px}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px}
  header h1{margin:0;font-size:30px;letter-spacing:.3px}
  header p{margin:6px 0 0;opacity:.92;font-size:15px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:10px 16px;min-width:104px}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
  main{padding:22px 0 48px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(84,57,158,.06)}
  .panel h2{margin:0 0 12px;font-size:17px}
  form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  form.add .full{grid-column:1/-1}
  label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);display:block;margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--plum);outline-offset:0;border-color:transparent}
  button{cursor:pointer;border:none;border-radius:9px;font-size:15px;font-weight:600}
  .btn-add{background:var(--plum);color:#fff;padding:11px 18px}
  .btn-add:hover{background:var(--plum-dark)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input{flex:1;min-width:180px}
  .toolbar select{width:auto;min-width:170px}
  .card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--plum);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .card .grow{flex:1;min-width:0}
  .card h3{margin:0;font-size:16px}
  .card .meta{font-size:13px;color:var(--grey);margin-top:3px}
  .pill{border-radius:999px;padding:6px 12px;font-size:13px;color:#fff;white-space:nowrap}
  .pill:hover{filter:brightness(1.1)}
  .st-Applied{background:var(--sky)} .st-Screening{background:var(--teal)}
  .st-Interview{background:var(--gold);color:#4a3200} .st-Offer{background:#3f9e4d}
  .st-Rejected{background:var(--grey)}
  .mini{background:none;color:var(--grey);font-size:13px;padding:6px 4px}
  .mini:hover{color:var(--rose)}
  .empty{text-align:center;color:var(--grey);padding:30px 10px;font-size:15px}
  footer{color:var(--grey);font-size:13px;text-align:center;padding:0 16px 34px}
  @media (max-width:560px){ form.add{grid-template-columns:1fr} .card{flex-wrap:wrap} }
</style>
</head>
